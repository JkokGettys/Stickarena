<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Stick Arena — top-down deathmatch</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="start" class="overlay">
      <div class="panel">
        <h1>STICK&nbsp;ARENA</h1>
        <p class="tag">Top-down arena deathmatch — grab weapons, frag everyone</p>
        <input id="name" maxlength="16" placeholder="Enter a name" autocomplete="off" spellcheck="false" />
        <button id="play">Play</button>
        <div class="help">
          <span><b>WASD</b> / arrows&nbsp;— move</span>
          <span><b>Mouse</b> aim&nbsp;· <b>Click</b> / <b>Space</b> shoot</span>
          <span>Run over <b>weapons</b> on the floor to pick them up</span>
          <span>Out of ammo? You drop back to <b>fists</b></span>
        </div>
        <div id="status" class="status">connecting…</div>
      </div>
    </div>

    <div id="endscreen" class="overlay endscreen hidden">
      <div class="end-panel">
        <div class="end-head">
          <h2>MATCH&nbsp;OVER</h2>
          <div id="end-countdown" class="end-countdown">Next match in 30s</div>
        </div>
        <div class="vote-section">
          <div class="vote-title">Vote for the next map</div>
          <div id="vote-row" class="vote-row"></div>
        </div>
        <table class="standings">
          <thead>
            <tr><th class="rk">#</th><th class="nm">Player</th><th>K</th><th>D</th><th>K/D</th></tr>
          </thead>
          <tbody id="standings-body"></tbody>
        </table>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
